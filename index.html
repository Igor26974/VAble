<!doctype html>
<html lang="en">
  <head>
    <title>BLE Recorder</title>
    <link rel="icon" href="favicon.ico"/>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="BLE oscilloscope and recorder">
    <link href="css/test.css" rel="stylesheet">
  </head>
  <body>
    <main id="app">
      <header class="toolbar">
        <button type="button" id="bt-btn">Connect</button>
        <details class="toolbar-group">
          <summary>Connection</summary>
          <div class="toolbar-group-content">
            <details id="transport-select" class="choice-menu" data-value="ble">
              <summary>Transport <strong class="choice-value">Bluetooth</strong></summary>
              <div class="choice-options">
                <button type="button" data-value="ble">Bluetooth</button>
                <button type="button" data-value="usb">USB Serial</button>
              </div>
            </details>
            <button type="button" id="fullscreen-btn" aria-pressed="false">Full screen</button>
            <button type="button" id="bt-btn2" disabled>Suspend</button>
          </div>
        </details>
        <details class="toolbar-group">
          <summary>View</summary>
          <div class="toolbar-group-content">
            <details id="channel-select" class="choice-menu" data-value="V">
              <summary>Channel <strong class="choice-value">V</strong></summary>
              <div class="choice-options">
                <button type="button" data-value="V">Voltage</button>
                <button type="button" data-value="I">Current</button>
                <button type="button" data-value="VI">V + I</button>
              </div>
            </details>
            <details id="chart-mode" class="choice-menu" data-value="history">
              <summary>Mode <strong class="choice-value">History</strong></summary>
              <div class="choice-options">
                <button type="button" data-value="history">History</button>
                <button type="button" data-value="scope">Oscilloscope</button>
              </div>
            </details>
            <label class="readout-toggle"><input type="checkbox" id="readout-v-toggle"> Readout V</label>
            <label class="readout-toggle"><input type="checkbox" id="readout-i-toggle"> Readout I</label>
            <button type="button" id="cursor-btn" aria-pressed="false">Cursors: Off</button>
          </div>
        </details>
        <details class="toolbar-group">
          <summary>Scales</summary>
          <div class="toolbar-group-content">
            <details id="time-div" class="choice-menu" data-value="0.001">
              <summary>Time/div <strong class="choice-value">1 ms</strong></summary>
              <div class="choice-options">
                <button type="button" data-value="0.001">1 ms</button>
                <button type="button" data-value="0.002">2 ms</button>
                <button type="button" data-value="0.005">5 ms</button>
                <button type="button" data-value="0.01">10 ms</button>
                <button type="button" data-value="0.02">20 ms</button>
                <button type="button" data-value="0.05">50 ms</button>
                <button type="button" data-value="0.1">100 ms</button>
                <button type="button" data-value="0.2">200 ms</button>
                <button type="button" data-value="0.5">500 ms</button>
                <button type="button" data-value="1">1 s</button>
                <button type="button" data-value="2">2 s</button>
                <button type="button" data-value="5">5 s</button>
                <button type="button" data-value="10">10 s</button>
                <button type="button" data-value="30">30 s</button>
                <button type="button" data-value="60">1 min</button>
              </div>
            </details>
            <details id="voltage-div" class="choice-menu" data-value="5">
              <summary>V/div <strong class="choice-value">5 V</strong></summary>
              <div class="choice-options">
                <button type="button" data-value="0.01">10 mV</button>
                <button type="button" data-value="0.02">20 mV</button>
                <button type="button" data-value="0.05">50 mV</button>
                <button type="button" data-value="0.1">100 mV</button>
                <button type="button" data-value="0.2">200 mV</button>
                <button type="button" data-value="0.5">500 mV</button>
                <button type="button" data-value="1">1 V</button>
                <button type="button" data-value="2">2 V</button>
                <button type="button" data-value="5">5 V</button>
                <button type="button" data-value="10">10 V</button>
                <button type="button" data-value="20">20 V</button>
              </div>
            </details>
            <details id="current-div" class="choice-menu" data-value="0.5">
              <summary>A/div <strong class="choice-value">500 mA</strong></summary>
              <div class="choice-options">
                <button type="button" data-value="0.001">1 mA</button>
                <button type="button" data-value="0.002">2 mA</button>
                <button type="button" data-value="0.005">5 mA</button>
                <button type="button" data-value="0.01">10 mA</button>
                <button type="button" data-value="0.02">20 mA</button>
                <button type="button" data-value="0.05">50 mA</button>
                <button type="button" data-value="0.1">100 mA</button>
                <button type="button" data-value="0.2">200 mA</button>
                <button type="button" data-value="0.5">500 mA</button>
                <button type="button" data-value="1">1 A</button>
                <button type="button" data-value="2">2 A</button>
                <button type="button" data-value="5">5 A</button>
                <button type="button" data-value="10">10 A</button>
                <button type="button" data-value="20">20 A</button>
                <button type="button" data-value="50">50 A</button>
              </div>
            </details>
          </div>
        </details>
        <details class="toolbar-group">
          <summary>Recording</summary>
          <div class="toolbar-group-content">
            <button type="button" id="download-btn">Download .BIN</button>
            <button type="button" id="clear-btn">Clear</button>
            <button type="button" id="upload-btn">Open .BIN</button>
          </div>
        </details>
        <form id="tx-form" class="tx-form">
          <input id="tx-msg" type="text" aria-label="Command for ESP32" value="start" autocomplete="off" disabled>
          <button type="submit" disabled>Send</button>
        </form>
      </header>
      <section class="status-bar" aria-live="polite">
        <pre id="rx-msg">Rx: waiting for connection</pre>
        <div id="label1">Recorded: 0 samples · 0 bytes</div>
      </section>
      <section class="chart-panel">
        <canvas id="mainChart" aria-label="Recorded signal chart"></canvas>
        <div class="chart-legend">
          <span class="voltage-key">V, V</span>
          <span class="current-key">I, A</span>
          <span id="chart-info"></span>
        </div>
        <div id="readout" class="readout" aria-label="Latest averaged values">
          <div id="readout-voltage">---.--- V</div>
          <div id="readout-current">---.--- A</div>
          <span class="readout-resize" aria-hidden="true"></span>
        </div>
      </section>
      <section class="navigator-panel">
        <canvas id="navChart" aria-label="Recording overview and range selector"></canvas>
      </section>
    </main>
    <div id="connection-alert" class="connection-alert" role="alertdialog" aria-modal="true" aria-labelledby="connection-alert-title" hidden>
      <div class="connection-alert-card">
        <h2 id="connection-alert-title">Connection interrupted</h2>
        <p id="connection-alert-message">No data has been received. Check the device and reconnect.</p>
        <div class="connection-alert-actions">
          <button type="button" id="connection-cancel">Cancel</button>
          <button type="button" id="connection-reconnect">Reconnect</button>
        </div>
      </div>
    </div>
    <script src="js/ble_mx_api.js"></script>
    <script src="js/test.js"></script>
  </body>
</html>
